# This deployment's own robot_2: identical to the C++ sibling package's
# robot_2_launch.yaml (real EasyNav navigation, same config/rviz, reused
# directly) except the fake manipulation capability is this package's own
# Python manipulation_fake_capability_node instead of that package's
# pluginlib-loaded C++ "robot_node" -- see manipulation_fake_capability.py
# for the reference implementation. Config files (manipulation_params.yaml,
# manipulation.json) are reused directly from the C++ sibling package:
# they are plain YAML/JSON, not C++-specific. See robot_1_launch.yaml.
launch:
  - arg: {name: "rviz", default: "true", description: "Open this robot's own rviz2"}
  - set_env: {name: "RMW_IMPLEMENTATION", value: "rmw_zenoh_cpp"}
  - group:
      - push_ros_namespace:
          namespace: "robot_2"

      - node:
          pkg: "easynav_system"
          exec: "system_main"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_easynav_collaboration_simple_api_deployment)/config/robot_2/easynav_system.costmap_rpp.params.yaml"
            - name: "tf_prefix"
              value: "robot_2"
          remap:
            # Each robot has its own TF tree, under its namespace (/robot_N/tf).
            - from: "/tf"
              to: "tf"
            - from: "/tf_static"
              to: "tf_static"
            - from: "maps_manager_node/costmap/incoming_map"
              to: "/global_map"
            - from: "maps_manager_node/routes/incoming_routes"
              to: "/global_routes"

      - node:
          pkg: "easyfleet_easynav_deployment"
          exec: "easynav_navigation_capability_node"
          name: "navigation"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_easynav_collaboration_simple_api_deployment)/config/navigation_params.yaml"
            - name: "behavior_tree_xml"
              value: "$(find-pkg-share easyfleet_easynav_deployment)/behavior_trees/navigate.xml"
            - name: "bt_plugins"
              value:
                - "$(find-pkg-prefix easyfleet_easynav_navigation)/lib/libeasynav_navigate_bt_node.so"
                - "$(find-pkg-prefix easyfleet_easynav_deployment)/lib/libstart_off_bt_node.so"
                - "$(find-pkg-prefix easyfleet_easynav_deployment)/lib/libfinish_bt_node.so"
            - name: "capabilities_file"
              value: "$(find-pkg-share easyfleet_easynav_collaboration_simple_api_deployment)/config/navigation.json"

      - node:
          pkg: "easyfleet_easynav_collaboration_simple_api_deployment_py"
          exec: "manipulation_fake_capability_node"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_easynav_collaboration_simple_api_deployment)/config/robot_2/manipulation_params.yaml"
            - name: "capabilities_file"
              value: "$(find-pkg-share easyfleet_easynav_collaboration_simple_api_deployment)/config/robot_2/manipulation.json"

      - node:
          if: "$(var rviz)"
          pkg: "rviz2"
          exec: "rviz2"
          output: "screen"
          remap:
            - from: "/tf"
              to: "tf"
            - from: "/tf_static"
              to: "tf_static"
          args: "-d $(find-pkg-share easyfleet_easynav_collaboration_simple_api_deployment)/rviz/robot_2.rviz"
          param:
            - name: "use_sim_time"
              value: true
