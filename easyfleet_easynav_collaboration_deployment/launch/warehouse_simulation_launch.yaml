# Gazebo with large_warehouse_world (github.com/juanscelyg/large_warehouse_world)
# and two Kobukis in its Warehouse A central plaza: robot_1 at world (100, 300)
# and robot_2 at world (102, 301), i.e. (0, 0) and (2, 1) in the warehouse map
# (easyfleet_easynav_deployment's maps/warehouse_a.yaml, origin at the center of
# Warehouse A). Each robot's topics and TF tree are under its namespace. Also
# starts the Zenoh router. Run it before warehouse_launch.yaml. The world is
# large (about 700 x 450 m): only Warehouse A is mapped and navigated.

launch:
  - arg: {name: "gui", default: "true", description: "Set to false to run Gazebo headless"}
  # At 12 m the lidar sees almost nothing in the open areas of the warehouse; at 30 m, 200+ of 360 rays hit.
  - arg: {name: "lidar_range", default: "30.0", description: "Maximum lidar range (m)"}
  # Each Kobuki carries a cylinder at lidar height (lidar_target) so the others' lidars see it.
  # Warehouse A furniture only: with the whole world's, two lidars halve the real time factor.
  - arg:
      name: "world"
      default: "$(find-pkg-share large_warehouse_world)/worlds/large_warehouse_world_a.sdf"
      description: "World file (large_warehouse_world.sdf for the whole furnished world)"
  # Zenoh by default: the router every node of this example connects to.
  - set_env: {name: "RMW_IMPLEMENTATION", value: "rmw_zenoh_cpp"}
  - executable:
      cmd: "ros2 run rmw_zenoh_cpp rmw_zenohd"
      output: "screen"
  # Gazebo finds the warehouse models here (the playground adds its own).
  - set_env:
      name: "GZ_SIM_RESOURCE_PATH"
      value: "$(find-pkg-share large_warehouse_world)/models:$(env GZ_SIM_RESOURCE_PATH '')"
  - include:
      file: "$(find-pkg-share easynav_playground_kobuki_worlds)/launch/world.launch.yaml"
      arg:
        - {name: "world", value: "$(var world)"}
        - {name: "gui", value: "$(var gui)"}
  - include:
      file: "$(find-pkg-share easynav_playground_kobuki_worlds)/launch/kobuki.launch.yaml"
      arg:
        - {name: "name", value: "kobuki_1"}
        - {name: "namespace", value: "robot_1"}
        - {name: "x", value: "100.0"}
        - {name: "y", value: "300.0"}
        - {name: "z", value: "0.05"}
        - {name: "lidar_range", value: "$(var lidar_range)"}
        - {name: "lidar_target", value: "true"}
  - include:
      file: "$(find-pkg-share easynav_playground_kobuki_worlds)/launch/kobuki.launch.yaml"
      arg:
        - {name: "name", value: "kobuki_2"}
        - {name: "namespace", value: "robot_2"}
        - {name: "x", value: "102.0"}
        - {name: "y", value: "301.0"}
        - {name: "z", value: "0.05"}
        - {name: "lidar_range", value: "$(var lidar_range)"}
        - {name: "lidar_target", value: "true"}
