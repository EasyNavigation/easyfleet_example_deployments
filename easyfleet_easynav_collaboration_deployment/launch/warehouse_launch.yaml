# The collaboration example in large_warehouse_world's Warehouse A: robot_1 and
# robot_2 with their EasyNav stacks on the warehouse map and aisle routes
# (easyfleet_easynav_deployment's maps/warehouse_a*.yaml), the navigation
# manager, the central rviz2 and, unless mission:=false, the example mission
# on waypoints placed in the warehouse (config/warehouse/). Run
# warehouse_simulation_launch.yaml first.

launch:
  - arg: {name: "robot_rviz", default: "false", description: "Also open each robot's own rviz2"}
  - arg: {name: "mission", default: "true", description: "Run the example mission"}
  - include:
      file: "$(find-pkg-share easyfleet_easynav_collaboration_deployment)/launch/easynav_collaboration_launch.yaml"
      arg:
        - {name: "robot_rviz", value: "$(var robot_rviz)"}
        - {name: "mission", value: "$(var mission)"}
        - {name: "robot_1_easynav_params", value: "$(find-pkg-share easyfleet_easynav_collaboration_deployment)/config/warehouse/robot_1/easynav_system.costmap_rpp.params.yaml"}
        - {name: "robot_2_easynav_params", value: "$(find-pkg-share easyfleet_easynav_collaboration_deployment)/config/warehouse/robot_2/easynav_system.costmap_rpp.params.yaml"}
        - {name: "navigation_params", value: "$(find-pkg-share easyfleet_easynav_collaboration_deployment)/config/warehouse/navigation_params.yaml"}
        - {name: "navigation_manager_params", value: "$(find-pkg-share easyfleet_easynav_collaboration_deployment)/config/warehouse/navigation_manager.params.yaml"}
