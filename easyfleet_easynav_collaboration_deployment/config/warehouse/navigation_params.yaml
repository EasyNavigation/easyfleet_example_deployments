# Waypoints in Warehouse A (map frame, origin at the warehouse center), with
# the names easynav_collaboration_mission_node uses: the robots' homes in the
# central plaza, the rest on the corridor between the two rack blocks.
/**:
  ros__parameters:
    navigation:
      allow_preemption: true
      tick_rate_hz: 10.0
      waypoint_ids: ["dock", "kitchen", "kitchen_standby", "charging_station", "robot_1_home", "robot_2_home"]
      waypoints:
        dock:
          frame_id: "map"
          x: 0.0
          y: 13.9
          yaw: 1.57
        kitchen:
          frame_id: "map"
          x: -6.0
          y: 13.9
          yaw: 3.14
        kitchen_standby:
          frame_id: "map"
          x: -4.0
          y: 13.9
          yaw: 3.14
        charging_station:
          frame_id: "map"
          x: 5.0
          y: -6.0
          yaw: 0.0
        robot_1_home:
          frame_id: "map"
          x: 0.0
          y: 0.0
          yaw: 0.0
        robot_2_home:
          frame_id: "map"
          x: 2.0
          y: 1.0
          yaw: 0.0
