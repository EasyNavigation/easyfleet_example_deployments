lifecycle_manager:
  ros__parameters:
    startup_timeout: 5
planner:
  ros__parameters:
    plan_solver_timeout: 15.0
    plan_solver_plugins: ["KAIROS"]
    KAIROS:
      plugin: "plansys2/KairosPlanSolver"
      # Keeps improving the plan until 2 s pass without a better one: the first
      # plans of this domain send carriers on long detours.
      no_improvement: 2.0
