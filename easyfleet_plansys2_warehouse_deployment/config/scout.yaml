# A scout: robot_node hosts a fake perception capability that detects packages.
/**:
  ros__parameters:
    capabilities: ["perception"]
    config_package: "easyfleet_plansys2_warehouse_deployment"
    config_subdir: "capabilities"
    perception:
      allow_preemption: true
      target_class: "package"
      detection_rate_hz: 5.0
      frame_id: "camera_link"
