# The fleet's map and routes (Warehouse A), shared by the four robots. Only
# what places each base_link in "map" is relayed to /tf, for the central RViz.
# Each robot also gets the others as obstacles (/<robot>/fleet_obstacles): a
# Kobuki's lidar barely sees another Kobuki (only its thin standoffs).
/**:
  ros__parameters:
    map_type: "costmap"
    map.package: "easyfleet_easynav_deployment"
    map.map_path_file: "maps/warehouse_a.yaml"
    routes.package: "easyfleet_easynav_deployment"
    routes.map_path_file: "maps/warehouse_a_routes.yaml"
    # Each robot keeps its TF under its namespace; only what places its
    # base_link in "map" reaches /tf, at most 10 times per second.
    robots.relay_tf: true
    robots.relay_tf_frames: ["odom", "base_footprint", "base_link"]
    robots.relay_tf_rate_hz: 10.0
    robots.share_obstacles: true
    robots.obstacle_radius_m: 0.25
