# Initial pose of each robot's localizer: its spawn pose in launch/simulation_launch.yaml
# (map frame, origin at the center of Warehouse A).
/robot_1/localizer_node:
  ros__parameters:
    costmap:
      initial_pose:
        x: 0.0
        y: 0.0
        yaw: 0.0
/robot_2/localizer_node:
  ros__parameters:
    costmap:
      initial_pose:
        x: 2.0
        y: 1.0
        yaw: 0.0
/robot_3/localizer_node:
  ros__parameters:
    costmap:
      initial_pose:
        x: 4.0
        y: 0.0
        yaw: 0.0
/robot_4/localizer_node:
  ros__parameters:
    costmap:
      initial_pose:
        x: 6.0
        y: 1.0
        yaw: 0.0
