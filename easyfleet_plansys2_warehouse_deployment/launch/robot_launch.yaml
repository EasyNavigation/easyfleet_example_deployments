# One Kobuki of the fleet, under the namespace "robot": EasyNav (system_main)
# with its navigation capability, and robot_node with the capability of its
# role: "scout" (perception) or "carrier" (manipulation).

launch:
  - arg: {name: "robot", description: "Robot name and namespace, e.g. robot_1"}
  - arg: {name: "role", description: "scout (perception) or carrier (manipulation)"}
  - arg: {name: "rviz", default: "false", description: "Open this robot's own rviz2"}
  - set_env: {name: "RMW_IMPLEMENTATION", value: "rmw_zenoh_cpp"}
  - group:
      - push_ros_namespace:
          namespace: "$(var robot)"

      - node:
          pkg: "easynav_system"
          exec: "system_main"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_plansys2_warehouse_deployment)/config/easynav_system.params.yaml"
            - from: "$(find-pkg-share easyfleet_plansys2_warehouse_deployment)/config/initial_poses.yaml"
            - name: "tf_prefix"
              value: "$(var robot)"
          remap:
            # Each robot has its own TF tree, under its namespace.
            - from: "/tf"
              to: "tf"
            - from: "/tf_static"
              to: "tf_static"
            # Fleet-wide map and routes, from navigation_manager_node.
            - from: "maps_manager_node/costmap/incoming_map"
              to: "/global_map"
            - from: "maps_manager_node/routes/incoming_routes"
              to: "/global_routes"

      - node:
          pkg: "easyfleet_easynav_deployment"
          exec: "easynav_navigation_capability_node"
          name: "navigation"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_plansys2_warehouse_deployment)/config/navigation_params.yaml"
            - name: "behavior_tree_xml"
              value: "$(find-pkg-share easyfleet_easynav_deployment)/behavior_trees/navigate.xml"
            - name: "bt_plugins"
              value:
                - "$(find-pkg-prefix easyfleet_easynav_navigation)/lib/libeasynav_navigate_bt_node.so"
                - "$(find-pkg-prefix easyfleet_easynav_deployment)/lib/libstart_off_bt_node.so"
                - "$(find-pkg-prefix easyfleet_easynav_deployment)/lib/libfinish_bt_node.so"
            - name: "capabilities_file"
              value: "$(find-pkg-share easyfleet_plansys2_warehouse_deployment)/config/capabilities/navigation.json"

      - node:
          pkg: "easyfleet_easynav_collaboration_deployment"
          exec: "robot_node"
          output: "screen"
          param:
            - from: "$(find-pkg-share easyfleet_plansys2_warehouse_deployment)/config/$(var role).yaml"

      - node:
          if: "$(var rviz)"
          pkg: "rviz2"
          exec: "rviz2"
          output: "screen"
          args: "-d $(find-pkg-share easyfleet_easynav_deployment)/rviz/easynav_costmap.rviz -f $(var robot)/map"
          param:
            - name: "use_sim_time"
              value: true
          remap:
            - from: "/tf"
              to: "tf"
            - from: "/tf_static"
              to: "tf_static"
            - from: "/maps_manager_node/costmap/dynamic_map"
              to: "maps_manager_node/costmap/dynamic_map"
            - from: "/maps_manager_node/costmap/dynamic_map_updates"
              to: "maps_manager_node/costmap/dynamic_map_updates"
            - from: "/scan_raw"
              to: "scan_raw"
            - from: "/localizer_node/costmap/particles"
              to: "localizer_node/costmap/particles"
            - from: "/planner_node/simple/path"
              to: "planner_node/simple/path"
            - from: "/goal_pose"
              to: "goal_pose"
