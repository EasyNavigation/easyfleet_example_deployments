# Gazebo with the granja_leon world (a farm terrain, GPS-referenced) and the
# Summit XL from easynav_playground_summit_worlds, not namespaced, plus the
# Zenoh router. Run it before robot_1_launch.yaml.

launch:
  - arg: {name: "gui", default: "true", description: "Set to false to run Gazebo headless"}
  # Zenoh by default: the router every node of this example connects to.
  - set_env: {name: "RMW_IMPLEMENTATION", value: "rmw_zenoh_cpp"}
  - executable:
      cmd: "ros2 run rmw_zenoh_cpp rmw_zenohd"
      output: "screen"
  # Gazebo finds the farm models here (the playground adds its own).
  - set_env:
      name: "GZ_SIM_RESOURCE_PATH"
      value: "$(find-pkg-share granja_leon)/models:$(env GZ_SIM_RESOURCE_PATH '')"
  - include:
      file: "$(find-pkg-share easynav_playground_summit_worlds)/launch/gazebo_sim.launch.yaml"
      arg:
        - {name: "world", value: "$(find-pkg-share granja_leon)/worlds/granja_leon.world"}
        - {name: "gui", value: "$(var gui)"}
