# Parameters for easyfleet_navigation_manager's navigation_manager_node,
# launched once for this whole scenario, fleet-wide, not per robot (see
# launch/easynav_collaboration_launch.yaml) -- publishes the same
# map/routes both robots' own config/robot_1|robot_2/easynav_system.costmap_rpp.params.yaml
# point their maps_manager_node at locally (maps/home2.yaml,
# maps/routes_1.yaml), centrally on /global_map and /global_routes.
# Reuses easyfleet_easynav_deployment's own copies of those files (same
# package this scenario already depends on for the navigation capability
# itself) rather than duplicating them again here.
#
# Uses the "/**" wildcard, matching this package's other params files
# (see navigation_params.yaml's own comment for why): navigation_manager_node
# itself is never namespaced today, but this keeps the file correct if
# that ever changes.
/**:
  ros__parameters:
    map_type: "costmap"
    map.package: "easyfleet_easynav_deployment"
    map.map_path_file: "maps/home2.yaml"
    routes.package: "easyfleet_easynav_deployment"
    routes.map_path_file: "maps/routes_1.yaml"
    # Each robot keeps its TF under its namespace; only what places its
    # base_link in "map" reaches /tf, at most 10 times per second.
    robots.relay_tf: true
    robots.relay_tf_frames: ["odom", "base_footprint", "base_link"]
    robots.relay_tf_rate_hz: 10.0
