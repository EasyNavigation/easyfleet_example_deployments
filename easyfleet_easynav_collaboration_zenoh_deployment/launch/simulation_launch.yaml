# Gazebo (small house world, from easynav_playground_kobuki_worlds), the
# /clock bridge and both Kobukis -- robot_1 at (0, 0), robot_2 at (2, 1),
# matching config/robot_N -- each in its own Zenoh island (see zenoh.md):
# the world and its /clock bridge use the central session, each Kobuki's
# nodes use its robot's session. Each part is a group, so the RMW/session
# environment set for one never leaks into the next. Also starts the three
# Zenoh routers (central, robot_1, robot_2). system_main, the capabilities and
# rviz2 come from robot_N_launch.yaml / easynav_collaboration_launch.yaml.

launch:
  - arg: {name: "gui", default: "true", description: "Set to false to run Gazebo headless"}
  - executable:
      cmd: "ros2 run rmw_zenoh_cpp rmw_zenohd"
      output: "screen"
      env:
        - name: "ZENOH_ROUTER_CONFIG_URI"
          value: "$(find-pkg-share easyfleet_easynav_collaboration_zenoh_deployment)/config/zenoh_router_central.json5"
  - executable:
      cmd: "ros2 run rmw_zenoh_cpp rmw_zenohd"
      output: "screen"
      env:
        - name: "ZENOH_ROUTER_CONFIG_URI"
          value: "$(find-pkg-share easyfleet_easynav_collaboration_zenoh_deployment)/config/robot_1/zenoh_router.json5"
  - executable:
      cmd: "ros2 run rmw_zenoh_cpp rmw_zenohd"
      output: "screen"
      env:
        - name: "ZENOH_ROUTER_CONFIG_URI"
          value: "$(find-pkg-share easyfleet_easynav_collaboration_zenoh_deployment)/config/robot_2/zenoh_router.json5"
  - timer:
      period: 2.0
      children:
        - group:
            - set_env: {name: "RMW_IMPLEMENTATION", value: "rmw_zenoh_cpp"}
            - set_env:
                name: "ZENOH_SESSION_CONFIG_URI"
                value: "$(find-pkg-share easyfleet_easynav_collaboration_zenoh_deployment)/config/zenoh_session_central.json5"
            - include:
                file: "$(find-pkg-share easynav_playground_kobuki_worlds)/launch/world.launch.yaml"
                arg:
                  - {name: "gui", value: "$(var gui)"}
        - group:
            - set_env: {name: "RMW_IMPLEMENTATION", value: "rmw_zenoh_cpp"}
            - set_env:
                name: "ZENOH_SESSION_CONFIG_URI"
                value: "$(find-pkg-share easyfleet_easynav_collaboration_zenoh_deployment)/config/robot_1/zenoh_session.json5"
            - include:
                file: "$(find-pkg-share easynav_playground_kobuki_worlds)/launch/kobuki.launch.yaml"
                arg:
                  - {name: "name", value: "kobuki_1"}
                  - {name: "namespace", value: "robot_1"}
        - group:
            - set_env: {name: "RMW_IMPLEMENTATION", value: "rmw_zenoh_cpp"}
            - set_env:
                name: "ZENOH_SESSION_CONFIG_URI"
                value: "$(find-pkg-share easyfleet_easynav_collaboration_zenoh_deployment)/config/robot_2/zenoh_session.json5"
            - include:
                file: "$(find-pkg-share easynav_playground_kobuki_worlds)/launch/kobuki.launch.yaml"
                arg:
                  - {name: "name", value: "kobuki_2"}
                  - {name: "namespace", value: "robot_2"}
                  - {name: "x", value: "2.0"}
                  - {name: "y", value: "1.0"}
