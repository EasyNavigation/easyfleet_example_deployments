# Real-navigation variant of the "easynav" deployment scenario: launches
# both the robot (easynav_robot_gazebo_launch.yaml -- real EasyNav, costmap
# localizer/maps-manager/planner + regulated pure-pursuit controller,
# instead of the Dummy* plugins used by easynav_launch.yaml, plus rviz2)
# and mission control (easynav_mission_node), for testing against a real
# robot or Gazebo simulation of one -- start that separately, *before* this
# launch file, so the robot is already localized and ready to move by the
# time mission control's first goal is sent.
#
# easynav_mission_node is delayed a few seconds so the capability node has
# finished activating (and published its /capabilities announcement)
# before mission control's discovery window (see
# easyfleet_mission_manager::discover_capabilities()) opens.
#
# robot_namespace forwards to easynav_robot_gazebo_launch.yaml's own
# argument of the same name (default "", unnamespaced, for a single real
# robot, and simulation_launch.yaml's unnamespaced Kobuki).
launch:
  # Zenoh by default; needs the router started by simulation_launch.yaml.
  - set_env: {name: "RMW_IMPLEMENTATION", value: "rmw_zenoh_cpp"}
  - arg:
      name: "robot_namespace"
      default: ""
      description: "Namespace the robot is pushed under. Empty (default) for a single unnamespaced real robot/Gazebo instance."
  - arg:
      name: "easynav_params"
      default: "$(find-pkg-share easyfleet_easynav_deployment)/config/easynav_robot/easynav_system.costmap_rpp.params.yaml"
      description: "EasyNav (system_main) parameters file"
  - arg:
      name: "navigation_params"
      default: "$(find-pkg-share easyfleet_easynav_deployment)/config/easynav_robot/navigation_params.yaml"
      description: "Navigation capability parameters file (waypoints)"
  - arg:
      name: "navigation_manager_params"
      default: "$(find-pkg-share easyfleet_easynav_deployment)/config/easynav_robot/navigation_manager.params.yaml"
      description: "navigation_manager parameters file (fleet map and routes)"
  - arg: {name: "mission", default: "true", description: "Run the mission (easynav_mission_node)"}

  - include:
      file: "$(find-pkg-share easyfleet_easynav_deployment)/launch/easynav_robot_gazebo_launch.yaml"
      arg:
        - name: "robot_namespace"
          value: "$(var robot_namespace)"
        - name: "easynav_params"
          value: "$(var easynav_params)"
        - name: "navigation_params"
          value: "$(var navigation_params)"

  # Fleet-wide navigation manager: publishes the same map/routes the robot
  # above would otherwise load locally on /global_map and /global_routes
  # (see easynav_robot_gazebo_launch.yaml's "incoming_map"/"incoming_routes"
  # remaps on system_main). transient_local durability means start order
  # relative to the robot doesn't matter -- a late subscriber still gets
  # the retained message.
  - node:
      pkg: "easyfleet_navigation_manager"
      exec: "navigation_manager_node"
      output: "screen"
      param:
        - from: "$(var navigation_manager_params)"

  - timer:
      if: "$(var mission)"
      period: 3.0
      children:
        - node:
            pkg: "easyfleet_easynav_deployment"
            exec: "easynav_mission_node"
            output: "screen"
