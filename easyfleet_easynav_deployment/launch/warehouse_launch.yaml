# easynav_gazebo_launch.yaml in Warehouse A: EasyNav + its RViz, the navigation
# capability and navigation_manager, with
# config/warehouse (maps/warehouse_a.yaml and maps/warehouse_a_routes.yaml).
# Send goals with RViz's 2D Goal Pose. Run warehouse_simulation_launch.yaml first.

launch:
  # The mission gives each goal 10 s (sized for the small house): off by default here.
  - arg: {name: "mission", default: "false", description: "Run the mission (dock, then kitchen)"}
  - include:
      file: "$(find-pkg-share easyfleet_easynav_deployment)/launch/easynav_gazebo_launch.yaml"
      arg:
        - {name: "easynav_params", value: "$(find-pkg-share easyfleet_easynav_deployment)/config/warehouse/easynav_system.costmap_rpp.params.yaml"}
        - {name: "navigation_params", value: "$(find-pkg-share easyfleet_easynav_deployment)/config/warehouse/navigation_params.yaml"}
        - {name: "navigation_manager_params", value: "$(find-pkg-share easyfleet_easynav_deployment)/config/warehouse/navigation_manager.params.yaml"}
        - {name: "mission", value: "$(var mission)"}
