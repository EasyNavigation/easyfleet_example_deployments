# Gazebo (small house world, from easynav_playground_kobuki_worlds), the
# /clock bridge and both Kobukis -- robot_1 at (0, 0), robot_2 at (2, 1),
# matching config/robot_N -- each in its own ROS_DOMAIN_ID (see fastdds.md):
# the world and its /clock bridge in the central domain 0, each Kobuki's nodes
# in its robot's domain (1, 2). Each part is a group, so the domain set for
# one never leaks into the next. This example is about Fast DDS + DDS Router,
# so it pins rmw_fastrtps_cpp. system_main, the capabilities, the DDS Routers
# and rviz2 come from robot_N_launch.yaml / easynav_collaboration_launch.yaml.

launch:
  - arg: {name: "gui", default: "true", description: "Set to false to run Gazebo headless"}
  - set_env: {name: "RMW_IMPLEMENTATION", value: "rmw_fastrtps_cpp"}
  - group:
      - set_env: {name: "ROS_DOMAIN_ID", value: "0"}
      - include:
          file: "$(find-pkg-share easynav_playground_kobuki_worlds)/launch/world.launch.yaml"
          arg:
            - {name: "gui", value: "$(var gui)"}
  - timer:
      period: 2.0
      children:
        - group:
            - set_env: {name: "ROS_DOMAIN_ID", value: "1"}
            - include:
                file: "$(find-pkg-share easynav_playground_kobuki_worlds)/launch/kobuki.launch.yaml"
                arg:
                  - {name: "name", value: "kobuki_1"}
                  - {name: "namespace", value: "robot_1"}
        - group:
            - set_env: {name: "ROS_DOMAIN_ID", value: "2"}
            - include:
                file: "$(find-pkg-share easynav_playground_kobuki_worlds)/launch/kobuki.launch.yaml"
                arg:
                  - {name: "name", value: "kobuki_2"}
                  - {name: "namespace", value: "robot_2"}
                  - {name: "x", value: "2.0"}
                  - {name: "y", value: "1.0"}
