# robot_2's DDS Router bridge: connects robot_2's own ROS_DOMAIN_ID (2) with
# the central island's (0). See config/robot_1/dds_router.yaml for the full
# rationale behind every choice here (identical except for the domain ID,
# the "robot_1"->"robot_2" namespace, and "perception"->"manipulation") and
# fastdds.md for the design discussion and empirical findings.
participants:
  - name: robot_domain
    kind: local
    domain: 2

  - name: central_domain
    kind: local
    domain: 0

allowlist:
  - name: "*capabilities"
  - name: "*capabilities_status"
  - name: "*global_map"
  - name: "*global_routes"
  - name: "*clock"
  - name: "*mission_status_markers"
  - name: "*robot_2/navigation*"
  - name: "*robot_2/manipulation*"
  - name: "*robot_2/planner_node*"
  - name: "*robot_2/easynav_control*"
  - name: "rt/robot_2/tf"
  - name: "rt/robot_2/tf_static"

topics:
  - name: "*capabilities"
    qos:
      durability: true
      reliability: true
  - name: "*global_map"
    qos:
      durability: true
      reliability: true
  - name: "*global_routes"
    qos:
      durability: true
      reliability: true
  - name: "*robot_2/navigation*"
    qos:
      durability: true
      reliability: true
  - name: "*robot_2/manipulation*"
    qos:
      durability: true
      reliability: true
  - name: "rt/robot_2/tf_static"
    qos:
      durability: true
      reliability: true

topic-routes:
  - name: "rt/robot_2/tf"
    type: "tf2_msgs::msg::dds_::TFMessage_"
    routes:
      - src: robot_domain
        dst:
          - central_domain
      - src: central_domain

  - name: "rt/robot_2/tf_static"
    type: "tf2_msgs::msg::dds_::TFMessage_"
    routes:
      - src: robot_domain
        dst:
          - central_domain
      - src: central_domain
